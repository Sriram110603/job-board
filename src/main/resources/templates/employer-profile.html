<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employer Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            font-family: 'Segoe UI', sans-serif;
        }

        .profile-card {
            max-width: 600px;
            margin: 80px auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-title {
            font-weight: 700;
            margin-bottom: 20px;
        }

        .profile-item {
            margin-bottom: 15px;
        }

        .label {
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="profile-card">

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.updated}" class="alert alert-success">
        Profile updated successfully
    </div>

    <h3 class="profile-title">Employer Profile</h3>

    <!-- 🔥 ONE FORM ONLY -->
    <form th:action="@{/employer/profile}" method="post">

        <div class="profile-item">
            <div class="label">Company Name</div>
            <input type="text" name="companyName" class="form-control"
                   th:value="${employer.companyName}" required>
        </div>

        <div class="profile-item">
            <div class="label">Email</div>
            <input type="email" class="form-control"
                   th:value="${employer.email}" readonly>
        </div>

        <div class="profile-item">
            <div class="label">Phone</div>
            <input type="text" name="phone" class="form-control"
                   th:value="${employer.phone}">
        </div>

        <div class="profile-item">
            <div class="label">Company Size</div>
            <input type="text" name="companySize" class="form-control"
                   th:value="${employer.companySize}">
        </div>

        <button type="submit" class="btn btn-success mt-3">
            Save Changes
        </button>

        <a href="/dashboard" class="btn btn-secondary mt-3">
            Back
        </a>

    </form>

</div>

</body>
</html>
