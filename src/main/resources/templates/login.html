<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Job Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --accent: #FFD600; /* Funky Yellow */
            --secondary: #00D1FF; /* Funky Blue for Employers */
            --dark: #000000;
            --shadow: 8px 8px 0px 0px #000;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .bg-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--dark) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.1;
            z-index: -1;
            animation: movePattern 20s linear infinite;
        }

        @keyframes movePattern {
            from { background-position: 0 0; }
            to { background-position: 60px 60px; }
        }

        .login-card {
            background: #fff;
            border: 4px solid var(--dark);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            transform: rotate(-1deg);
            transition: transform 0.2s ease;
            position: relative;
        }

        .login-card:hover {
            transform: rotate(0deg) scale(1.01);
        }

        /* --- ROLE SWITCHER STYLES --- */
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-label {
            display: block;
            text-align: center;
            padding: 10px;
            border: 3px solid var(--dark);
            font-weight: 800;
            cursor: pointer;
            transition: 0.1s;
            background: #fff;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        /* Candidate Styling */
        input[id="employee"]:checked + .role-label {
            background: var(--accent);
            box-shadow: 4px 4px 0px 0px var(--dark);
            transform: translate(-2px, -2px);
        }

        /* Employer Styling */
        input[id="employer"]:checked + .role-label {
            background: var(--secondary);
            box-shadow: 4px 4px 0px 0px var(--dark);
            transform: translate(-2px, -2px);
        }

        .brand-tag {
            background: var(--accent);
            color: var(--dark);
            font-weight: 800;
            padding: 5px 15px;
            border: 2px solid var(--dark);
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .login-title {
            font-weight: 900;
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1;
        }

        .form-control {
            border: 3px solid var(--dark);
            border-radius: 0;
            height: 55px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .form-control:focus {
            box-shadow: 4px 4px 0px 0px var(--accent);
            border-color: var(--dark);
            outline: none;
        }

        .btn-funky {
            background: var(--dark);
            color: #fff;
            border: none;
            border-radius: 0;
            height: 60px;
            font-weight: 800;
            text-transform: uppercase;
            width: 100%;
            transition: 0.1s;
        }

        .btn-funky:hover {
            background: var(--dark);
            box-shadow: 6px 6px 0px 0px var(--accent);
            transform: translate(-3px, -3px);
        }

        .footer-text {
            margin-top: 25px;
            text-align: center;
            font-weight: 700;
        }

        .footer-text a {
            color: var(--dark);
            text-decoration: underline;
            text-decoration-thickness: 3px;
        }

        .floating-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #FF6B6B;
            border: 4px solid var(--dark);
            border-radius: 50%;
            top: -40px;
            right: -30px;
            z-index: -1;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="login-card">
    <div class="floating-circle"></div>
    <div class="brand-tag">Portal Access</div>
    <h1 class="login-title">LOGIN.</h1>
    
    <form th:action="@{/login}" method="post">
        
        

        <input type="email" name="username" class="form-control" placeholder="YOUR EMAIL" required>
        <input type="password" name="password" class="form-control" placeholder="YOUR PASSWORD" required>
        
        <button type="submit" class="btn btn-funky">
            Enter the Portal →
        </button>

        <div class="footer-text">
            No account? <a th:href="@{/register}">Sign up now</a>
        </div>

        <div th:if="${param.error}" style="background: #FF6B6B; border: 3px solid #000; padding: 10px; margin-top: 15px; font-weight: 800; text-align: center;">
            ACCESS DENIED: WRONG EMAIL/PASS
        </div>
    </form>
</div>

</body>
</html>
