<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>User Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet"/>

<style>
body{
    background:#f5f7fb;
    font-family:"Segoe UI",sans-serif;
}
.select2-container {
    width: 100% !important;
}
.profile-container{
    max-width:900px;
    margin:40px auto;
}

.card{
    border-radius:12px;
    border:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.section-title{
    font-weight:600;
    margin-bottom:20px;
}

.progress{
    height:12px;
}

.progress-label{
    font-size:0.9rem;
    margin-bottom:5px;
}
.select2-container--default .select2-selection--multiple {
    min-height: 38px;
    border: 1px solid #ced4da;
    border-radius: .375rem;
}
</style>

</head>

<body>

<div class="container profile-container">

<div class="card p-4">

<h4 class="mb-4">Complete Your Profile</h4>

<div class="mb-4">

<div class="progress-label">
Profile Completion:
<strong th:text="${profile.profileCompletion} + '%'"></strong>
</div>

<div class="progress">
<div class="progress-bar bg-success"
role="progressbar"
th:style="'width:' + ${profile.profileCompletion} + '%'">
</div>
</div>

</div>

<form th:action="@{/profile}" method="post" th:object="${profile}">

	<h5 class="section-title">Skills</h5>

	<div class="row">

	    <!-- PRIMARY SKILLS -->
	    <div class="col-md-6 mb-3">
	        <label class="form-label">Primary Skills *</label>

	        <select class="form-select skill-select"
	                th:field="*{primarySkills}"
	                multiple="multiple"
	                style="width:100%">

	            <option value="Java">Java</option>
	            <option value="Spring Boot">Spring Boot</option>
	            <option value="SQL">SQL</option>
	            <option value="MySQL">MySQL</option>
	            <option value="PostgreSQL">PostgreSQL</option>
	            <option value="Docker">Docker</option>
	            <option value="Kubernetes">Kubernetes</option>
	            <option value="AWS">AWS</option>
	            <option value="React">React</option>
	            <option value="Angular">Angular</option>
	            <option value="Vue">Vue</option>
	            <option value="HTML">HTML</option>
	            <option value="CSS">CSS</option>
	            <option value="JavaScript">JavaScript</option>
	            <option value="Python">Python</option>
	            <option value="Django">Django</option>
	            <option value="Flask">Flask</option>
	            <option value="C">C</option>
	            <option value="C++">C++</option>
	            <option value="C#">C#</option>
	            <option value=".NET">.NET</option>
	            <option value="Git">Git</option>
	            <option value="GitHub">GitHub</option>
	            <option value="Jenkins">Jenkins</option>
	            <option value="CI/CD">CI/CD</option>
	            <option value="Linux">Linux</option>
	            <option value="Redis">Redis</option>
	            <option value="Kafka">Kafka</option>
	            <option value="GraphQL">GraphQL</option>
	            <option value="Bootstrap">Bootstrap</option>
	            <option value="Machine Learning">Machine Learning</option>
	            <option value="Data Analysis">Data Analysis</option>

	        </select>
	    </div>

	    <!-- SECONDARY SKILLS -->
	    <div class="col-md-6 mb-3">
	        <label class="form-label">Secondary Skills</label>

	        <select class="form-select skill-select"
	                th:field="*{secondarySkills}"
	                multiple="multiple"
	                style="width:100%">

	            <!-- SAME OPTIONS -->
	            <option value="Java">Java</option>
	            <option value="Spring Boot">Spring Boot</option>
	            <option value="SQL">SQL</option>
	            <option value="MySQL">MySQL</option>
	            <option value="PostgreSQL">PostgreSQL</option>
	            <option value="Docker">Docker</option>
	            <option value="Kubernetes">Kubernetes</option>
	            <option value="AWS">AWS</option>
	            <option value="React">React</option>
	            <option value="Angular">Angular</option>
	            <option value="Vue">Vue</option>
	            <option value="HTML">HTML</option>
	            <option value="CSS">CSS</option>
	            <option value="JavaScript">JavaScript</option>
	            <option value="Python">Python</option>
	            <option value="Django">Django</option>
	            <option value="Flask">Flask</option>
	            <option value="C">C</option>
	            <option value="C++">C++</option>
	            <option value="C#">C#</option>
	            <option value=".NET">.NET</option>
	            <option value="Git">Git</option>
	            <option value="GitHub">GitHub</option>
	            <option value="Jenkins">Jenkins</option>
	            <option value="CI/CD">CI/CD</option>
	            <option value="Linux">Linux</option>
	            <option value="Redis">Redis</option>
	            <option value="Kafka">Kafka</option>
	            <option value="GraphQL">GraphQL</option>
	            <option value="Bootstrap">Bootstrap</option>
	            <option value="Machine Learning">Machine Learning</option>
	            <option value="Data Analysis">Data Analysis</option>

	        </select>
	    </div>

	</div>
<h5 class="section-title mt-3">Experience</h5>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Total Experience (Years)</label>

<input type="number"
class="form-control"
th:field="*{totalExperience}"
min="0"
max="40">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Notice Period</label>

<select class="form-select" th:field="*{noticePeriod}">
<option value="">Select</option>
<option value="Immediate">Immediate</option>
<option value="15 Days">15 Days</option>
<option value="30 Days">30 Days</option>
<option value="60 Days">60 Days</option>
<option value="90 Days">90 Days</option>
</select>

</div>

</div>

<h5 class="section-title mt-3">Current Location</h5>

<div class="row">

<div class="col-md-4 mb-3">
<input type="text"
class="form-control"
placeholder="City"
th:field="*{city}">
</div>

<div class="col-md-4 mb-3">
<input type="text"
class="form-control"
placeholder="State"
th:field="*{state}">
</div>

<div class="col-md-4 mb-3">
<input type="text"
class="form-control"
placeholder="Country"
th:field="*{country}">
</div>

</div>

<h5 class="section-title mt-3">Job Preferences</h5>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Preferred Job Locations</label>

<input type="text"
class="form-control"
placeholder="Chennai, Bangalore, Remote"
th:field="*{preferredLocations}">

</div>

<div class="col-md-6 mb-3">
<label class="form-label">Expected Salary</label>

<input type="number"
class="form-control"
th:field="*{expectedSalary}">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Relocation Radius</label>

<select class="form-select"
th:field="*{relocationRadius}">

<option value="">Select</option>
<option value="<10 km">&lt;10 km</option>
<option value="<20 km">&lt;20 km</option>
<option value="<50 km">&lt;50 km</option>
<option value="No relocation">No relocation</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Employment Type</label>

<select class="form-select"
th:field="*{employmentType}">

<option value="">Select</option>
<option value="Full-time">Full-time</option>
<option value="Contract">Contract</option>
<option value="Internship">Internship</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Work Mode</label>

<select class="form-select"
th:field="*{workMode}">

<option value="">Select</option>
<option value="Onsite">Onsite</option>
<option value="Hybrid">Hybrid</option>
<option value="Remote">Remote</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Willing to Relocate</label>

<div class="form-check">
<input class="form-check-input"
type="radio"
th:field="*{willingToRelocate}"
value="true">
<label class="form-check-label">Yes</label>
</div>

<div class="form-check">
<input class="form-check-input"
type="radio"
th:field="*{willingToRelocate}"
value="false">
<label class="form-check-label">No</label>
</div>

</div>

</div>

<button type="submit"
class="btn btn-primary w-100 mt-3">
Save Profile </button>

</form>

</div>
</div>

<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/css/select2.min.css" rel="stylesheet"/>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/js/select2.min.js"></script>

<script>
	$(function(){

	    if ($.fn.select2) {
	        $('.skill-select').select2({
	            placeholder: "Search and select skills",
	            width: '100%',
	            closeOnSelect: false
	        });
	    } else {
	        console.error("Select2 NOT LOADED");
	    }

	});
</script>

</body>
</html>
