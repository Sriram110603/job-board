<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8">
<title>User Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>
body{
    background:#f5f7fb;
    font-family:"Segoe UI",sans-serif;
}

.profile-container{
    max-width:900px;
    margin:40px auto;
}

.card{
    border-radius:12px;
    border:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.section-title{
    font-weight:600;
    margin-bottom:20px;
}

.progress{
    height:12px;
}

.progress-label{
    font-size:0.9rem;
    margin-bottom:5px;
}
</style></head><body><div class="container profile-container"><div class="card p-4"><h4 class="mb-4">Complete Your Profile</h4><!-- PROFILE COMPLETION --><div class="mb-4"><div class="progress-label">
Profile Completion:
<strong th:text="${profile.profileCompletion} + '%'"></strong>
</div><div class="progress">
<div class="progress-bar bg-success"
role="progressbar"
th:style="'width:' + ${profile.profileCompletion} + '%'">
</div>
</div></div><form th:action="@{/profile}" method="post" th:object="${profile}"><!-- SKILLS --><h5 class="section-title">Skills</h5><div class="row"><div class="col-md-6 mb-3">
<label class="form-label">Primary Skills *</label>
<input type="text"
class="form-control"
placeholder="Java, Spring Boot, SQL"
th:field="*{primarySkills}"
required>
</div><div class="col-md-6 mb-3">
<label class="form-label">Secondary Skills</label>
<input type="text"
class="form-control"
placeholder="React, Docker, AWS"
th:field="*{secondarySkills}">
</div></div><!-- EXPERIENCE --><h5 class="section-title mt-3">Experience</h5><div class="row"><div class="col-md-6 mb-3">
<label class="form-label">Total Experience (Years)</label>
<input type="number"
class="form-control"
th:field="*{totalExperience}">
</div><div class="col-md-6 mb-3">
<label class="form-label">Notice Period</label><select class="form-select" th:field="*{noticePeriod}">
<option value="">Select</option>
<option value="Immediate">Immediate</option>
<option value="15 Days">15 Days</option>
<option value="30 Days">30 Days</option>
<option value="60 Days">60 Days</option>
<option value="90 Days">90 Days</option>
</select></div></div><!-- LOCATION --><h5 class="section-title mt-3">Current Location</h5><div class="row"><div class="col-md-4 mb-3">
<input type="text"
class="form-control"
placeholder="City"
th:field="*{city}">
</div><div class="col-md-4 mb-3">
<input type="text"
class="form-control"
placeholder="State"
th:field="*{state}">
</div><div class="col-md-4 mb-3">
<input type="text"
class="form-control"
placeholder="Country"
th:field="*{country}">
</div></div><!-- JOB PREFERENCES --><h5 class="section-title mt-3">Job Preferences</h5><div class="row"><div class="col-md-6 mb-3">
<label class="form-label">Preferred Job Locations</label>
<input type="text"
class="form-control"
placeholder="Chennai, Bangalore, Remote"
th:field="*{preferredLocations}">
</div><div class="col-md-6 mb-3">
<label class="form-label">Expected Salary</label>
<input type="number"
class="form-control"
th:field="*{expectedSalary}">
</div></div><div class="row"><div class="col-md-6 mb-3">
<label class="form-label">Current CTC</label>
<input type="number"
class="form-control"
th:field="*{currentCTC}">
</div><div class="col-md-6 mb-3"><label class="form-label">Employment Type</label>

<select class="form-select" th:field="*{employmentType}">
<option value="">Select</option>
<option value="Full-time">Full-time</option>
<option value="Contract">Contract</option>
<option value="Internship">Internship</option>
</select></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Work Mode</label>

<select class="form-select" th:field="*{workMode}">
<option value="">Select</option>
<option value="Onsite">Onsite</option>
<option value="Hybrid">Hybrid</option>
<option value="Remote">Remote</option>
</select></div><div class="col-md-6 mb-3"><label class="form-label">Willing to Relocate</label>

<div class="form-check">
<input class="form-check-input"
type="radio"
th:field="*{willingToRelocate}"
value="true">
<label class="form-check-label">Yes</label>
</div><div class="form-check">
<input class="form-check-input"
type="radio"
th:field="*{willingToRelocate}"
value="false">
<label class="form-check-label">No</label>
</div></div></div><button type="submit" class="btn btn-primary w-100 mt-3">
Save Profile
</button></form></div>
</div></body>
</html>
