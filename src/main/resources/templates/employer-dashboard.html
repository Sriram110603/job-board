<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(-45deg, #0d6efd, #6610f2, #0ea5e9, #6366f1);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            padding-top: 50px;
        }

        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 30px;
        }

        .nav-pills .nav-link.active {
            background-color: #6610f2;
        }

        .nav-link {
            color: #444;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="dashboard-card">
				<div class="d-flex justify-content-between align-items-center mb-4">

				    <h2>Employer Dashboard</h2>

				    <div>
				        <span class="badge bg-primary me-3">
				            Welcome, <span th:text="${employerName}">Company</span>
				        </span>

				        <form th:action="@{/logout}" method="post" style="display:inline;">
				            <button class="btn btn-danger btn-sm">Logout</button>
				        </form>
				    </div>

				</div>
                <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="post-job-tab" data-bs-toggle="pill" data-bs-target="#post-job" type="button">Post a Job</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="view-jobs-tab" data-bs-toggle="pill" data-bs-target="#view-jobs" type="button">View Posted Jobs</button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    
                    <div class="tab-pane fade show active" id="post-job" role="tabpanel">
                        <h4>Create New Job Opening</h4>
                        <hr>
                        <form th:action="@{/employer/post-job}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Job Title</label>
                                    <input type="text" name="title" class="form-control" placeholder="e.g. Senior Java Developer" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Location</label>
                                    <input type="text" name="location" class="form-control" placeholder="Remote / City, State" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Job Description</label>
                                    <textarea name="description" class="form-control" rows="4" placeholder="Describe responsibilities and requirements..." required></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Salary Range</label>
                                    <input type="text" name="salary" class="form-control" placeholder="e.g. $80k - $120k">
                                </div>
								<div class="col-12">
								    <label class="form-label">Mandatory Skills *</label>
									<select class="form-select skill-select"
									        name="mandatorySkills"
									        multiple="multiple"
									        style="width:100%">
											<option value="Java">Java</option>
											<option value="Spring Boot">Spring Boot</option>
											<option value="SQL">SQL</option>
											<option value="MySQL">MySQL</option>
											<option value="PostgreSQL">PostgreSQL</option>
											<option value="Docker">Docker</option>
											<option value="Kubernetes">Kubernetes</option>
											<option value="AWS">AWS</option>
											<option value="React">React</option>
											<option value="Angular">Angular</option>
											<option value="Vue">Vue</option>
											<option value="HTML">HTML</option>
											<option value="CSS">CSS</option>
											<option value="JavaScript">JavaScript</option>
											<option value="Python">Python</option>
											<option value="Django">Django</option>
											<option value="Flask">Flask</option>
											<option value="C">C</option>
											<option value="C++">C++</option>
											<option value="C#">C#</option>
											<option value=".NET">.NET</option>
											<option value="Git">Git</option>
											<option value="GitHub">GitHub</option>
											<option value="Jenkins">Jenkins</option>
											<option value="CI/CD">CI/CD</option>
											<option value="Linux">Linux</option>
											<option value="Redis">Redis</option>
											<option value="Kafka">Kafka</option>
											<option value="GraphQL">GraphQL</option>
											<option value="Bootstrap">Bootstrap</option>
											<option value="Machine Learning">Machine Learning</option>
											<option value="Data Analysis">Data Analysis</option>

								    </select>
								</div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-success px-4">Publish Job</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="view-jobs" role="tabpanel">
                        <h4>Manage Applications</h4>
                        <hr>
						<div class="table-responsive">
							<table class="table">
							    <thead>
							        <tr>
							            <th>Job</th>
							            <th>Candidate</th>
							            <th>Applied Date</th>
							            <th>Status</th>
							        </tr>
							    </thead>

							    <tbody>
							        <tr th:each="app : ${applications}">
							            <td th:text="${app.job.title}"></td>
							            <td th:text="${app.user.email}"></td>
							            <td th:text="${app.appliedDate}"></td>
							            <td th:text="${app.status}"></td>
							        </tr>
							    </tbody>
							</table>
						</div>                    </div>
                </div> </div>
        </div>
    </div>
</div>

<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/css/select2.min.css" rel="stylesheet"/>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
	$(function(){

	    if ($.fn.select2) {
	        $('.skill-select').select2({
	            placeholder: "Search and select skills",
	            width: '100%',
	            closeOnSelect: false
	        });
	    } else {
	        console.error("Select2 NOT LOADED");
	    }

	});
</script>
</body>
</html>
