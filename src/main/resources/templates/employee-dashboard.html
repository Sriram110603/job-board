<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Job Board</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            font-family: 'Segoe UI', sans-serif;
        }

        .container-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .job-card {
            border-radius: 12px;
            padding: 20px;
            background: #f9fafb;
            transition: 0.3s;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .btn-apply {
            background: #4f46e5;
            border: none;
        }

        .btn-apply:hover {
            background: #4338ca;
        }
		
		
		.profile-btn {
		    width: 38px;
		    height: 38px;
		    background-color: #0d6efd;
		    color: white;
		    border-radius: 50%;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    text-decoration: none;
		}

		.profile-btn i {
		    font-size: 18px;
		}
		
    </style>
</head>

<body>

	
<div class="container">
    <div class="container-box">
		
		<div class="d-flex justify-content-between align-items-center mb-4">
		    <h3 class="mb-0">Available Jobs</h3>

		    <div class="d-flex align-items-center gap-2">

		        <!-- Profile -->
		        <a href="/profile"
		           title="Profile"
		           class="profile-btn">
		           
		            <i class="bi bi-person-fill"></i>
		        </a>

		        <!-- Logout -->
		        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>

		    </div>
		</div>

        <div class="row" th:if="${jobs != null}">

            <div class="col-md-6 mb-4" th:each="job : ${jobs}">
                <div class="job-card">

                    <h5 th:text="${job.title}"></h5>
                    <p class="text-muted mb-1" th:text="${job.company}"></p>
                    <small class="text-muted" th:text="${job.location}"></small>

                    <form th:action="@{/apply}" method="post" class="mt-3">
                        <input type="hidden" name="jobId" th:value="${job.id}">
                        <button type="submit" class="btn btn-apply btn-sm text-white">
                            Apply Now
                        </button>
                    </form>

                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
