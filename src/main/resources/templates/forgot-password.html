<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Job Board</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f1f5f9;
            --accent: #FFD600;
            --dark: #000000;
            --shadow: 8px 8px 0px 0px #000;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #fff;
            border: 4px solid var(--dark);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .login-title {
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .form-control {
            border: 3px solid var(--dark);
            height: 55px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-funky {
            background: var(--dark);
            color: #fff;
            height: 55px;
            font-weight: 800;
            width: 100%;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h2 class="login-title">Forgot Password</h2>

    <form th:action="@{/forgot-password}" method="post">
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>

        <button type="submit" class="btn btn-funky">
            Continue →
        </button>
    </form>

    <p style="color:red; margin-top:10px;" th:text="${error}"></p>
</div>

</body>
</html>
