<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employer Login | High-Growth Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #E0E7FF;
            --accent: #22C55E;
            --primary: #6366F1;
            --dark: #1A1A1A;
            --shadow: 10px 10px 0px 0px #1A1A1A;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Changed from height to min-height for mobile scroll */
            margin: 0;
            padding: 20px; /* Padding for mobile edges */
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Moving Grid Background */
        .bg-grid {
            position: fixed; /* Fixed so it doesn't scroll with content */
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--primary) 2px, transparent 2px),
                linear-gradient(90deg, var(--primary) 2px, transparent 2px);
            background-size: 60px 60px;
            opacity: 0.15;
            z-index: -1;
            transform: rotateX(60deg) translateY(-20%);
            animation: moveGrid 15s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 60px; }
        }

        /* Responsive Main Card */
        .login-card {
            background: #fff;
            border: 4px solid var(--dark);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px; /* Desktop width */
            padding: clamp(20px, 5vw, 50px); /* Fluid padding */
            position: relative;
            z-index: 10;
        }

        /* Overlapping Employer Badge */
        .employer-badge {
            position: absolute;
            top: -20px;
            left: 20px;
            background: var(--dark);
            color: #fff;
            padding: 8px 15px;
            font-weight: 900;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            transform: rotate(-3deg);
            border: 3px solid var(--primary);
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .login-title {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            /* clamp(min, preferred, max) - perfectly responsive font */
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            margin-top: 15px;
            margin-bottom: 0px;
            color: var(--dark);
            letter-spacing: -2px;
            line-height: 0.9;
        }

        .subtitle {
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--primary);
            text-transform: uppercase;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            letter-spacing: 2px;
        }

        label {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 8px;
            display: block;
            color: var(--dark);
        }

        .form-control {
            border: 4px solid var(--dark);
            border-radius: 0;
            height: clamp(55px, 8vw, 65px);
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        /* The Funky Action Button */
        .btn-hiring {
            background: var(--accent);
            color: var(--dark);
            border: 4px solid var(--dark);
            border-radius: 0;
            height: clamp(65px, 10vw, 75px);
            font-weight: 900;
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
            transition: 0.1s;
            box-shadow: 6px 6px 0px 0px var(--dark);
        }

        .footer-links {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap; /* Wraps links on tiny screens */
            gap: 10px;
            justify-content: space-between;
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* Responsive Sticker */
        .sticker {
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: clamp(80px, 15vw, 110px);
            height: clamp(80px, 15vw, 110px);
            background: #FFD600;
            border: 4px solid var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            border-radius: 50%;
            transform: rotate(15deg);
            animation: wiggle 4s infinite ease-in-out;
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            z-index: 20;
            pointer-events: none; /* Prevents sticker from blocking clicks */
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(15deg) scale(1); }
            50% { transform: rotate(-5deg) scale(1.1); }
        }

        /* Medium Devices (Tablets) */
        @media (max-width: 768px) {
            .login-card {
                max-width: 400px;
                padding: 30px;
            }
            .bg-grid {
                animation: moveGrid 25s linear infinite; /* Slow down bg on mobile */
            }
        }

        /* Small Devices (Phones) */
        @media (max-width: 480px) {
            .login-card {
                box-shadow: 6px 6px 0px 0px var(--dark); /* Smaller shadow for smaller screen */
            }
            .sticker {
                bottom: -20px;
                right: -10px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="login-card">
        <div class="employer-badge">Employer Portal</div>
        
        <h1 class="login-title">HIRE<br>ELITE.</h1>
        <p class="subtitle">Secure your dream team.</p>
        
        <form th:action="@{/login}" method="post">
            <div>
                <label for="username">Admin Email</label>
                <input type="email" id="username" name="username" class="form-control" placeholder="ceo@company.com" required>
            </div>
            
            <div>
                <label for="password">Security Passcode</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-hiring">
                ENTER CENTER →
            </button>

            <div class="footer-links">
                <a href="#">Reset Key?</a>
                <a th:href="@{/register}">Add Company</a>
            </div>

            <div th:if="${param.error}" class="alert-error">
                AUTH ERROR
            </div>
        </form>

        <div class="sticker">SCALE<br>YOUR<br>TEAM</div>
    </div>

</body>
</html>
